# dsh 组合包 patch 层：用 MySQL 后端替换默认 jsonl 后端。
# 当用户 `dsh plugin add @sandersyao/dsh-session-persistence-mysql`
# 后，该文件作为本 bundle 的配置层被应用到 profile。
#
# 说明：
# - patch 按插件 `id` 定位、后应用者覆盖先应用者；`disabled: true` 停用 jsonl。
# - `insert:` 追加新行；`name` 是包名，loader 用其默认导出构造插件。
# - `config` 可选；主机/库/凭据由环境变量 `MYSQL_*` 提供，
#   `connection.tablePrefix` 可在此覆盖 env 的 `MYSQL_TABLE_PREFIX`。
- id: session-persistence-jsonl
  disabled: true

- insert:
    - id: session-persistence-mysql
      name: '@sandersyao/dsh-session-persistence-mysql'
      config:
        connection:
          tablePrefix: dsh_
